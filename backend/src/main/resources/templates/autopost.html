<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>処理中...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #4299e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <p>外部サービスへ接続中です。そのままお待ちください...</p>

    <!--
        ============================================================
        【Autopostフォームの核心部分】

        このフォームはユーザーには見えない。
        ページ読み込み直後にJavaScriptが自動でsubmitする。

        メリット:
        - GETではなくPOSTでデータを送れる（URLにデータが露出しない）
        - クロスオリジンへのリダイレクトが可能
        - 複数のhiddenフィールドでデータをまとめて送信できる
        ============================================================
    -->
    <form id="autoPostForm"
          th:action="${formData.actionUrl}"
          method="POST">

        <!--
            th:each でhiddenFieldsマップを展開する。
            key/valueがそれぞれ name/value 属性になる。
        -->
        <input type="hidden"
               th:each="field : ${formData.hiddenFields}"
               th:name="${field.key}"
               th:value="${field.value}" />

        <!-- JavaScriptが無効な環境向けのフォールバックボタン -->
        <noscript>
            <button type="submit">続行する</button>
        </noscript>
    </form>
</div>

<script>
    /*
     * ページ読み込み完了後、即座にフォームをsubmitする。
     * これがautopostの核心。ユーザーは何もクリックしない。
     */
    window.addEventListener('load', function () {
        document.getElementById('autoPostForm').submit();
    });
</script>

</body>
</html>
